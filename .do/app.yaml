name: msd-foundation
region: blr

static_sites:
  - name: msd-frontend
    build_command: npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${msd-backend.PUBLIC_URL}
    github:
      branch: main
      deploy_on_push: true
      repo_clone_url: https://github.com/<your-org>/<your-repo>.git

services:
  - name: msd-backend
    source_dir: backend
    build_command: npm install --production
    run_command: npm start
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: ${msd-frontend.PUBLIC_URL}
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDINARY_CLOUD_NAME
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDINARY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDINARY_API_SECRET
        scope: RUN_TIME
        type: SECRET
    github:
      branch: main
      deploy_on_push: true
      repo_clone_url: https://github.com/<your-org>/<your-repo>.git
